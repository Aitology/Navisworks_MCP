<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <linearGradient id="claudeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF9F5"/>
      <stop offset="100%" stop-color="#E8E3D5"/>
    </linearGradient>
    <linearGradient id="pyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF7E6"/>
      <stop offset="100%" stop-color="#FFD43B"/>
    </linearGradient>
    <linearGradient id="navGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="550" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">
    Navisworks MCP Bridge — Architecture
  </text>
  <text x="550" y="58" text-anchor="middle" font-size="13" fill="#6B7280">
    Three processes, two protocols, one model
  </text>

  <!-- Box: Claude Desktop -->
  <g filter="url(#shadow)">
    <rect x="40" y="120" width="240" height="200" rx="14" fill="url(#claudeGrad)" stroke="#C9C2B0" stroke-width="1.5"/>
    <text x="160" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Claude Desktop</text>
    <text x="160" y="170" text-anchor="middle" font-size="11" fill="#6B7280">(MCP client)</text>
    <line x1="60" y1="184" x2="260" y2="184" stroke="#C9C2B0"/>
    <text x="160" y="208" text-anchor="middle" font-size="12" fill="#374151">User asks for clash tests,</text>
    <text x="160" y="226" text-anchor="middle" font-size="12" fill="#374151">selection sets, viewpoints…</text>
    <text x="160" y="266" text-anchor="middle" font-size="11" fill="#6B7280">Spawns the Python server</text>
    <text x="160" y="282" text-anchor="middle" font-size="11" fill="#6B7280">via claude_desktop_config.json</text>
    <text x="160" y="298" text-anchor="middle" font-size="11" fill="#6B7280">and talks JSON-RPC over stdio.</text>
  </g>

  <!-- Box: Python MCP Server -->
  <g filter="url(#shadow)">
    <rect x="430" y="120" width="240" height="200" rx="14" fill="url(#pyGrad)" stroke="#E5A700" stroke-width="1.5"/>
    <text x="550" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Python MCP Server</text>
    <text x="550" y="170" text-anchor="middle" font-size="11" fill="#92400E">server_http.py</text>
    <line x1="450" y1="184" x2="650" y2="184" stroke="#E5A700"/>
    <text x="550" y="210" text-anchor="middle" font-size="12" fill="#374151">35 MCP tools</text>
    <text x="550" y="228" text-anchor="middle" font-size="12" fill="#374151">Translates each call to a</text>
    <text x="550" y="246" text-anchor="middle" font-size="12" fill="#374151">JSON HTTP POST.</text>
    <text x="550" y="282" text-anchor="middle" font-size="11" fill="#6B7280">Runs anywhere Python runs.</text>
    <text x="550" y="298" text-anchor="middle" font-size="11" fill="#6B7280">No COM, no pywin32.</text>
  </g>

  <!-- Box: Navisworks + Addin -->
  <g filter="url(#shadow)">
    <rect x="820" y="120" width="240" height="200" rx="14" fill="url(#navGrad)" stroke="#0369A1" stroke-width="1.5"/>
    <text x="940" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Navisworks</text>
    <text x="940" y="170" text-anchor="middle" font-size="11" fill="#E0F2FE">Manage / Simulate 2025–27</text>

    <!-- Inner box: addin -->
    <rect x="836" y="186" width="208" height="120" rx="10" fill="#FFFFFF" stroke="#0369A1" stroke-width="1"/>
    <text x="940" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#0369A1">MCPBridge.dll</text>
    <text x="940" y="224" text-anchor="middle" font-size="10" fill="#6B7280">in-process .NET addin</text>
    <line x1="846" y1="234" x2="1034" y2="234" stroke="#E0F2FE"/>
    <text x="940" y="252" text-anchor="middle" font-size="11" fill="#374151">HttpListener :8765</text>
    <text x="940" y="270" text-anchor="middle" font-size="11" fill="#374151">35 routes</text>
    <text x="940" y="290" text-anchor="middle" font-size="10" fill="#6B7280">Marshals to UI thread</text>
  </g>

  <!-- Arrow: Claude → Python -->
  <line x1="282" y1="220" x2="426" y2="220" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect x="304" y="190" width="100" height="22" rx="11" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="354" y="206" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">stdio</text>
  <text x="354" y="248" text-anchor="middle" font-size="10" fill="#6B7280">JSON-RPC 2.0</text>
  <text x="354" y="262" text-anchor="middle" font-size="10" fill="#6B7280">(MCP protocol)</text>

  <!-- Arrow: Python → Navisworks -->
  <line x1="672" y1="220" x2="816" y2="220" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect x="694" y="190" width="100" height="22" rx="11" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="744" y="206" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">HTTP</text>
  <text x="744" y="248" text-anchor="middle" font-size="10" fill="#6B7280">POST localhost:8765</text>
  <text x="744" y="262" text-anchor="middle" font-size="10" fill="#6B7280">JSON in / JSON out</text>

  <!-- Same machine note -->
  <rect x="40" y="360" width="1020" height="60" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="60" y="384" font-size="12" fill="#374151">
    <tspan font-weight="700">All three processes run on the same Windows machine.</tspan>
  </text>
  <text x="60" y="402" font-size="11" fill="#6B7280">
    The Python server is a thin translation layer — it does not need network access. The addin lives inside Navisworks itself, which gives it full access to NwApi (clash, selection sets, viewpoints, properties).
  </text>
</svg>
