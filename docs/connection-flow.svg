<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0369A1"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#10B981"/>
    </marker>
  </defs>

  <text x="550" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">
    Connection Flow — single tool call
  </text>
  <text x="550" y="56" text-anchor="middle" font-size="13" fill="#6B7280">
    Example: user asks Claude to run a clash test
  </text>

  <!-- Lifeline columns -->
  <g font-size="13" font-weight="700" fill="#111827">
    <rect x="60"   y="80" width="200" height="38" rx="8" fill="#FAF9F5" stroke="#C9C2B0"/>
    <text x="160" y="104" text-anchor="middle">Claude Desktop</text>

    <rect x="320"  y="80" width="200" height="38" rx="8" fill="#FFF7E6" stroke="#E5A700"/>
    <text x="420" y="104" text-anchor="middle">server_http.py</text>

    <rect x="580"  y="80" width="200" height="38" rx="8" fill="#E0F2FE" stroke="#0369A1"/>
    <text x="680" y="104" text-anchor="middle">MCPBridge.dll</text>

    <rect x="840"  y="80" width="200" height="38" rx="8" fill="#DCFCE7" stroke="#16A34A"/>
    <text x="940" y="104" text-anchor="middle">Navisworks NwApi</text>
  </g>

  <!-- Vertical lifelines -->
  <g stroke="#9CA3AF" stroke-dasharray="3 4">
    <line x1="160" y1="118" x2="160" y2="560"/>
    <line x1="420" y1="118" x2="420" y2="560"/>
    <line x1="680" y1="118" x2="680" y2="560"/>
    <line x1="940" y1="118" x2="940" y2="560"/>
  </g>

  <!-- 1: stdio request -->
  <g>
    <line x1="160" y1="160" x2="416" y2="160" stroke="#0369A1" stroke-width="2" marker-end="url(#arrL)"/>
    <rect x="180" y="138" width="220" height="20" rx="4" fill="#FFFFFF" stroke="#0369A1"/>
    <text x="290" y="152" text-anchor="middle" font-size="11" font-weight="600" fill="#0369A1">tools/call run_clash_test</text>
    <text x="290" y="178" text-anchor="middle" font-size="10" fill="#6B7280">JSON-RPC over stdio</text>
  </g>

  <!-- 2: server_http maps tool→route -->
  <g>
    <rect x="334" y="200" width="172" height="42" rx="6" fill="#FFFBEB" stroke="#E5A700"/>
    <text x="420" y="218" text-anchor="middle" font-size="11" font-weight="600" fill="#92400E">routes lookup + remap</text>
    <text x="420" y="234" text-anchor="middle" font-size="10" fill="#92400E">test_name → name</text>
  </g>

  <!-- 3: HTTP POST -->
  <g>
    <line x1="420" y1="280" x2="676" y2="280" stroke="#0369A1" stroke-width="2" marker-end="url(#arrL)"/>
    <rect x="440" y="258" width="220" height="20" rx="4" fill="#FFFFFF" stroke="#0369A1"/>
    <text x="550" y="272" text-anchor="middle" font-size="11" font-weight="600" fill="#0369A1">POST /clash/run {name:"X"}</text>
    <text x="550" y="298" text-anchor="middle" font-size="10" fill="#6B7280">HTTP / localhost:8765</text>
  </g>

  <!-- 4: addin marshals to UI thread -->
  <g>
    <rect x="594" y="320" width="172" height="42" rx="6" fill="#F0F9FF" stroke="#0369A1"/>
    <text x="680" y="338" text-anchor="middle" font-size="11" font-weight="600" fill="#0369A1">RunOnUi(...)</text>
    <text x="680" y="354" text-anchor="middle" font-size="10" fill="#075985">SynchronizationContext.Send</text>
  </g>

  <!-- 5: NwApi call -->
  <g>
    <line x1="680" y1="400" x2="936" y2="400" stroke="#0369A1" stroke-width="2" marker-end="url(#arrL)"/>
    <rect x="700" y="378" width="220" height="20" rx="4" fill="#FFFFFF" stroke="#0369A1"/>
    <text x="810" y="392" text-anchor="middle" font-size="11" font-weight="600" fill="#0369A1">TestsRunTest / TestsRunAllTests</text>
    <text x="810" y="418" text-anchor="middle" font-size="10" fill="#6B7280">in-process API call</text>
  </g>

  <!-- 6: NwApi returns -->
  <g>
    <line x1="940" y1="450" x2="684" y2="450" stroke="#10B981" stroke-width="2" marker-end="url(#arrR)"/>
    <rect x="720" y="428" width="180" height="20" rx="4" fill="#FFFFFF" stroke="#10B981"/>
    <text x="810" y="442" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">test ran, results updated</text>
  </g>

  <!-- 7: HTTP 200 -->
  <g>
    <line x1="680" y1="490" x2="424" y2="490" stroke="#10B981" stroke-width="2" marker-end="url(#arrR)"/>
    <rect x="460" y="468" width="180" height="20" rx="4" fill="#FFFFFF" stroke="#10B981"/>
    <text x="550" y="482" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">200 {"ran":["X"]}</text>
  </g>

  <!-- 8: stdio response -->
  <g>
    <line x1="420" y1="530" x2="164" y2="530" stroke="#10B981" stroke-width="2" marker-end="url(#arrR)"/>
    <rect x="200" y="508" width="180" height="20" rx="4" fill="#FFFFFF" stroke="#10B981"/>
    <text x="290" y="522" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">CallToolResult</text>
  </g>

  <!-- Footnote -->
  <text x="550" y="585" text-anchor="middle" font-size="11" fill="#6B7280">
    Errors are returned the same way — addin throws → 500 with JSON body → server_http surfaces it as isError=true
  </text>
</svg>
